schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./cmd/bowtie-json-schema
        - ./internal/cmd/conformance-manifest
operations:
  - module: .
    gate: fuzz
    steps:
      - type: make
        makefile: verification/package.mk
        target: fuzz
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmark
        timeout: 20m
